rules_files: [falco_rules.yaml, raven_zeek_rules.yaml]
engine:
  kind: replay
  replay: {capture_file: reference.scap}
rule_matching: all
priority: debug
plugins:
  - name: container
    library_path: /proc/self/cwd/libcontainer.so
    init_config:
      engines:
        docker: {enabled: false}
        podman: {enabled: false}
        containerd: {enabled: false}
        cri: {enabled: false}
        lxc: {enabled: false}
        libvirt_lxc: {enabled: false}
        bpm: {enabled: false}
  - name: raven_zeek
    library_path: /proc/self/cwd/libraven_zeek.so
    open_params: '{"events":"events.jsonl","pcap":"packets.pcap","format":"stream","history_bytes":134217728,"retention_metrics":true}'
load_plugins: [container, raven_zeek]
watch_config_files: false
log_stderr: true
log_syslog: false
syslog_output: {enabled: false}
stdout_output: {enabled: true}
json_output: true
json_include_message_property: true
time_format_iso_8601: true
append_output:
  - match: {source: syscall}
    extra_fields: [evt.num, evt.type, thread.tid]
